services:
  - type: web
    name: cryptosignals-pro
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DB_FILE
        value: /data/cryptosignals.db
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: PAYMENT_COIN
        value: USDT
      - key: PAYMENT_NETWORK
        value: TRC20
      - key: PAYMENT_ADDRESS
        value: TYFUmFhLoFwsxFbxuSJ1buppVAtp5Yiq3F
      - key: VIP_PRICE
        value: 49
      - key: TRON_API_URL
        value: https://api.trongrid.io
      - key: TRON_API_KEY
        sync: false
      - key: USDT_TRC20_CONTRACT
        value: TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6
    disk:
      name: cryptosignals-data
      mountPath: /data
      sizeGB: 1
